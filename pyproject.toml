[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trialign"
version = "0.1.0"
description = "Clinically meaningful retrieval and comparison of trial eligibility criteria"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
authors = [{name = "Jonathan Ma"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "pyarrow>=16,<22",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
models = [
  "torch>=2.3,<3",
  "transformers>=4.44,<6",
  "datasets>=2.20,<5",
  "sentence-transformers>=3.0,<6",
  "accelerate>=0.33,<2",
  "faiss-cpu>=1.8,<2",
]
app = [
  "openai>=1.40,<3",
  "fastapi>=0.112,<1",
  "uvicorn[standard]>=0.30,<1",
  "streamlit>=1.37,<2",
  "httpx>=0.27,<1",
]
plots = ["matplotlib>=3.9,<4", "seaborn>=0.13,<1"]
dev = ["pytest>=8.3,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1"]

[project.scripts]
trialign = "trialign.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
